name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      spatial_rust_ref:
        description: Shared Rust commit or branch for the native test job
        required: false
        type: string
  workflow_call:

jobs:
    test:
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]

      runs-on: ${{ matrix.os }}
      env:
        GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      steps:
        - name: checkout code
          uses: actions/checkout@v6

        - name: Install uv and Python
          uses: astral-sh/setup-uv@v8.0.0
          with:
            python-version: "3.11"
            enable-cache: true

        - name: Install R
          uses: r-lib/actions/setup-r@v2
          with:
            r-version: "release"

        - name: Install dependencies
          run: uv sync --locked --group dev

        - name: Run tests
          run: uv run -m pytest

    native:
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.spatial_rust_ref != '' }}
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]
      runs-on: ${{ matrix.os }}
      steps:
        - uses: actions/checkout@v6
        - uses: actions/checkout@v6
          with:
            repository: spatial-spur/spatial-rust
            ref: ${{ inputs.spatial_rust_ref }}
            path: native-core
            persist-credentials: false
        - uses: astral-sh/setup-uv@v8.0.0
          with:
            python-version: '3.11'
        - name: Install dependencies and build the native extension
          run: |
            rustup toolchain install stable --profile minimal
            uv sync --locked --group dev
            uv pip install ./native-core/crates/spatial-py
        - name: Require the compatible native extension
          run: uv run --no-sync python -c 'from scpc.core import load_rust_backend; assert load_rust_backend() is not None'
        - name: Test native execution and fallback parity
          run: uv run --no-sync -m pytest tests/test_rust_m1.py tests/test_lnget_oms.py tests/test_projection_corrections.py
